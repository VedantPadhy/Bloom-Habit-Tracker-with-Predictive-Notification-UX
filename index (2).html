<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bloom — A little, every day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F4F3EC;--card:#FBFAF6;--ink:#232A24;--mute:#7C8277;--g:#3E5B49;--on:#fff;--sage:#E3E6DA;--line:#E2E3D9;--tan:#A8905A;--warn:#C0794B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151815;--card:#1E221E;--ink:#ECEEE6;--mute:#9AA294;--g:#93BBA0;--on:#12170F;--sage:#2A302A;--line:#2D332D;--tan:#C9B27A;--warn:#D99A70}}
:root[data-theme="dark"]{--bg:#151815;--card:#1E221E;--ink:#ECEEE6;--mute:#9AA294;--g:#93BBA0;--on:#12170F;--sage:#2A302A;--line:#2D332D;--tan:#C9B27A;--warn:#D99A70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.s{font-family:Newsreader,Georgia,serif;font-weight:400;letter-spacing:-.01em}
h1.s{font-size:34px;line-height:1.15}h2.s{font-size:22px}
small,.m{color:var(--mute);font-size:12px}
#app{display:flex;min-height:100vh}
.sb{width:220px;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;flex:none}
.brand{font-size:26px;padding:0 10px 22px;display:flex;gap:8px;align-items:center}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mute);cursor:pointer;text-align:left;transition:.15s}
.nv:hover{background:var(--sage)}.nv.on{background:var(--sage);color:var(--ink);font-weight:500}
.nv svg,.btn svg{width:18px;height:18px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
main{flex:1;padding:28px 36px;max-width:1120px;margin:0 auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;width:min(260px,40vw)}
.srch input,.f input,.f select,.f textarea{border:0;outline:0;background:none;width:100%}
.ib{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}.col{display:grid;gap:20px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.gr{flex:1;min-width:0}.gr b{font-weight:500;display:block}.row.on .gr b{color:var(--mute);text-decoration:line-through}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--g)) 18%,transparent);color:var(--c,var(--g))}
.ck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--mute);background:none;color:transparent;display:grid;place-items:center;cursor:pointer;transition:.2s;flex:none}
.ck:hover{border-color:var(--g)}.ck.on{background:var(--g);border-color:var(--g);color:var(--on);transform:scale(1.05)}
.ck svg{width:16px;height:16px}
.btn{background:var(--g);color:var(--on);border:0;border-radius:12px;padding:10px 18px;font-weight:500;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--warn);color:#fff}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--mute)}.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:11px;background:var(--sage);border-radius:99px;padding:2px 9px;color:var(--mute)}.tag.w{color:var(--warn)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:21px}
.bars{display:flex;gap:6px;align-items:stretch}.bc{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.bt{flex:1;display:flex;align-items:flex-end;width:100%;justify-content:center}.b{width:100%;max-width:26px;background:var(--sage);border-radius:7px;transition:.4s}.b.hl{background:var(--g)}.b{transform-origin:bottom;animation:gr .5s both}@keyframes gr{from{transform:scaleY(0)}}
.pb{height:6px;border-radius:9px;background:var(--sage);overflow:hidden}.pb i{display:block;height:100%;background:var(--g);border-radius:9px;transition:.4s}
.ins{background:var(--sage);border:0}.f{display:grid;gap:6px;margin-bottom:14px}.f>span{font-size:12px;color:var(--mute)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--g)}.err{color:var(--warn);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cd{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative}
.cd.t{outline:2px solid var(--g)}.cd.sel{box-shadow:0 0 0 3px var(--tan)}.cd.x:after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.ov{position:fixed;inset:0;background:rgba(20,25,20,.45);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.md{background:var(--card);border-radius:24px;padding:26px;width:min(480px,100%);max-height:92vh;overflow:auto}
.pick{display:flex;gap:8px;flex-wrap:wrap}.pk{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}.pk.on{border-color:var(--g);background:var(--sage)}
.cl{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px var(--line)}.cl.on{box-shadow:0 0 0 2px var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:90;animation:up .3s}
.center{margin:auto;width:min(420px,92vw);padding:30px 0;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:22px 0}.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{width:22px;background:var(--g)}
.cf{position:absolute;width:9px;height:9px;border-radius:3px;animation:fall 2.2s ease-in infinite}@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(420px) rotate(360deg);opacity:0}}
.big{width:min(380px,100%);text-align:center;position:relative;overflow:hidden}
.stat b{font:400 30px Newsreader,serif;display:block}
@media (max-width:860px){.sb{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:20;background:var(--card);border-top:1px solid var(--line);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nv span,.brand,.me{display:none}.nv{padding:10px}main{padding:20px 16px 90px}.grid{grid-template-columns:1fr}h1.s{font-size:28px}}
.lg{width:28px;height:28px;border-radius:9px;background:var(--card);border:1px solid var(--line);position:relative;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}.lg:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#B97A52;top:7px;right:6px}
.devsw{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.devsw button{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer}.devsw button.on{background:var(--g);color:var(--on)}.devsw svg{width:17px;height:17px}
@media (max-width:860px){.devsw{display:none}}
@media (min-width:861px){body.ph{background:color-mix(in srgb,var(--sage) 70%,var(--bg))}body.ph:after{content:"";position:fixed;top:27px;left:50%;transform:translateX(-50%);width:96px;height:24px;background:#1b1d1b;border-radius:99px;z-index:100}.ph #app{width:390px;height:min(820px,calc(100vh - 32px));min-height:0;margin:16px auto;border:10px solid #1b1d1b;border-radius:48px;overflow:hidden;transform:translateZ(0);background:var(--bg);position:relative}.ph .sb{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:20;background:var(--card);border-top:1px solid var(--line);border-right:0;padding:6px 6px 10px}.ph .nv span,.ph .brand,.ph .me,.ph .top .srch{display:none}.ph .nv{padding:10px}.ph main{max-width:none;margin:0;height:100%;overflow:auto;padding:46px 16px 84px}.ph .grid{grid-template-columns:1fr}.ph h1.s{font-size:28px}.ph .center{width:calc(100% - 36px);padding-top:56px;max-height:100%;overflow:auto}}
</style></head><body><div id="app"></div><div id="dv"></div><script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const D=k=>new Date(k+'T00:00:00'),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const T=new Date();T.setHours(0,0,0,0);
const f12=t=>{let[h,m]=t.split(':').map(Number);return(h%12||12)+':'+pad(m)+(h<12?' AM':' PM')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Fitness','Health','Mind','Growth','Social','Home'],ICO=['dumbbell','droplet','book-open','leaf','sparkles','moon','pen-line','coffee','heart','music','footprints','brain'];
const COL=['#3E5B49','#4F8FA8','#A8905A','#7E6BA8','#C0794B','#5C6B8F'],AVC=['#3E5B49','#A8905A','#7E6BA8','#4F8FA8','#C0794B'];
const DN=['S','M','T','W','T','F','S'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function seed(){const H=[['Morning workout','Fitness','dumbbell','07:00','30 min',.4,0],['Drink 3L water','Health','droplet','09:00','3 litres',.88,1],['Read 20 minutes','Mind','book-open','21:30','20 min',.75,2],['Meditation','Mind','leaf','06:30','10 min',.8,3],['Learn something new','Growth','sparkles','18:00','25 min',.65,4],['Sleep before 11 PM','Health','moon','22:15','8 hours',.7,5],['Learn Japanese','Growth','brain','19:30','15 min',.7,3],['Stretching','Fitness','heart','07:15','10 min',.6,1],['Wind down','Mind','coffee','21:45','15 min',.55,2],['Evening journal','Mind','pen-line','22:00','5 min',.5,4]];
const habits=H.map((a,i)=>({id:'h'+i,name:a[0],cat:a[1],icon:a[2],time:a[3],target:a[4],color:COL[a[6]],desc:'',freq:[0,1,2,3,4,5,6],on:true,paused:false}));
const log={};for(let d=1;d<=60;d++){const ids=[];habits.forEach((h,i)=>{let r=Math.sin(d*12.9898+i*78.233)*43758.5453;r-=Math.floor(r);if(r<H[i][5]+(d<=8?.3:0))ids.push(h.id)});log[K(add(T,-d))]=ids}
log[K(T)]=['h1','h3','h4'];
return{habits,log,user:{name:'Peter',email:'peter@bloom.app',av:0},theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',goal:5,notif:true,onboarded:false,authed:false,r:'today'}}
let S;try{S=JSON.parse(localStorage.getItem('flux'))}catch(e){}S=S||seed();Object.assign(S,{q:'',cat:'All',cm:new Date(T.getFullYear(),T.getMonth(),1),sel:K(T),ob:0,mode:'in',modal:null,confirm:null,cele:0,pw:0,errs:{}});
if(S.user&&S.user.name=='Alex'&&/^alex@/.test(S.user.email)){S.user.name='Peter';S.user.email='peter@bloom.app'}
let DR={};
const save=()=>{try{const{q,cat,cm,sel,ob,mode,modal,confirm,cele,pw,errs,...r}=S;localStorage.setItem('flux',JSON.stringify(r))}catch(e){}};
function toast(m){document.getElementById('toast')?.remove();const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
const sched=k=>S.habits.filter(h=>!h.paused&&h.freq.includes(D(k).getDay()));
const doneIds=k=>S.log[k]||[];
const pct=k=>{const s=sched(k);return s.length?s.filter(h=>doneIds(k).includes(h.id)).length/s.length:0};
const done=k=>sched(k).filter(h=>doneIds(k).includes(h.id)).length;
function streak(){let i=pct(K(T))>=.6?0:1,n=0;while(i<400&&pct(K(add(T,-i)))>=.6){n++;i++}return n}
function best(){let b=0,c=0;for(let i=90;i>=0;i--){if(pct(K(add(T,-i)))>=.6){c++;b=Math.max(b,c)}else c=0}return b}
const total=()=>Object.values(S.log).reduce((a,b)=>a+b.length,0);
const perfect=()=>Object.keys(S.log).filter(k=>sched(k).length&&pct(k)==1).length;
const avg=n=>{let a=0;for(let i=0;i<n;i++)a+=pct(K(add(T,-i)));return a/n};
function rate(h,n=30){let s=0,d=0;for(let i=1;i<=n;i++){const k=K(add(T,-i));if(h.freq.includes(D(k).getDay())){s++;if(doneIds(k).includes(h.id))d++}}return s?d/s:0}
function insight(){const a=S.habits.filter(h=>!h.paused);if(!a.length)return'Add a habit and Bloom will start noticing your patterns.';
const w=[...a].sort((x,y)=>rate(x)-rate(y))[0],r=Math.round(rate(w)*100);let by=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];for(let i=1;i<=42;i++){const d=add(T,-i);by[d.getDay()]+=pct(K(d));c[d.getDay()]++}
const bd=by.map((v,i)=>v/c[i]).indexOf(Math.max(...by.map((v,i)=>v/c[i])));
return`You complete “${esc(w.name)}” on ${r}% of days. ${sug(w).txt} Your strongest day is ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][bd]}.`}
const sug=h=>{const am=+h.time.split(':')[0]<12,t=am?'18:00':'07:30';return{t,txt:`Try moving the ${f12(h.time)} reminder to ${f12(t)}.`}};
const go=r=>{S.r=r;location.hash=r;render();scrollTo(0,0)};
const gm=()=>T.getHours()<12?'Good morning':T.getHours()<18?'Good afternoon':'Good evening';
function tog(id,k=K(T)){const a=S.log[k]||(S.log[k]=[]),i=a.indexOf(id),was=pct(k)==1,wp=pct(k);i<0?a.push(id):a.splice(i,1);
if(i<0&&!was&&pct(k)==1&&k==K(T))S.cele=1;else if(i<0&&wp<.6&&pct(k)>=.6)toast('Reward unlocked: '+rwd(k)[0]);else toast(i<0?'Nice — marked done':'Marked as not done');render()}
const ring=(p,l)=>`<svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="48" cy="48" r="40" fill="none" stroke="var(--g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${251.3*p} 999" transform="rotate(-90 48 48)" style="transition:.6s"/><text x="48" y="53" text-anchor="middle" font-family="Newsreader,serif" font-size="22" fill="var(--ink)">${l}</text></svg>`;
const bars=(v,l,hl,h=110)=>`<div class="bars" style="height:${h}px">${v.map((x,i)=>`<div class="bc"><div class="bt"><div class="b ${i==hl?'hl':''}" style="height:${Math.max(x*100,4)}%" title="${Math.round(x*100)}%"></div></div><small>${l[i]}</small></div>`).join('')}</div>`;
const row=(h,k=K(T))=>{const on=doneIds(k).includes(h.id);return`<div class="row ${on?'on':''}"><span class="ic" style="--c:${h.color}"><i data-lucide="${h.icon}"></i></span><div class="gr"><b>${esc(h.name)}</b><small>${esc(h.cat)} · ${esc(h.target)} · ${f12(h.time)}</small></div><button class="ck ${on?'on':''}" onclick="tog('${h.id}','${k}')" aria-label="Toggle ${esc(h.name)}"><i data-lucide="check"></i></button></div>`};
const empty=(i,t,s)=>`<div style="text-align:center;padding:34px 10px"><span class="ic" style="margin:0 auto 12px"><i data-lucide="${i}"></i></span><b>${t}</b><p class="m">${s}</p></div>`;
const week=()=>[...Array(7)].map((_,i)=>K(add(T,i-6)));
const RW=[['Fresh start','flag'],['Spark','zap'],['Sunrise','sun'],['Bloom','leaf'],['Steady','anchor'],['Melody','music'],['Week star','star'],['Brave heart','heart'],['Compass','compass'],['Ten strong','award'],['Feather','feather'],['Rocket','rocket'],['Lucky gem','gem'],['Fortnight','trophy'],['Bullseye','target'],['Big smile','smile'],['Golden key','key'],['Cloud nine','cloud'],['Sharp focus','eye'],['Crown','crown'],['Gift','gift'],['Flame','flame'],['Moonlight','moon'],['Page turner','book-open'],['Cheer','bell'],['Warm cup','coffee'],['Shine','sparkles'],['Rising','trending-up'],['Shield','shield'],['Thumbs up','thumbs-up'],['Month master','check-circle']];
const rwd=k=>RW[D(k).getDate()-1];
const monthly=()=>{const y=T.getFullYear(),mo=T.getMonth(),n=new Date(y,mo+1,0).getDate();let u=0,c='';for(let i=1;i<=n;i++){const k=y+'-'+pad(mo+1)+'-'+pad(i),r=rwd(k),f=D(k)>T,ok=!f&&pct(k)>=.6;if(ok)u++;c+=`<button class="cd" title="${r[0]}" style="${ok?'background:var(--g);color:var(--on);border-color:var(--g)':f?'opacity:.4':''}" onclick="toast('${r[0]}: ${ok?'unlocked':f?'unlocks on day '+i:k==K(T)?'finish 60% of today’s habits to unlock':'not completed that day'}')"><i data-lucide="${ok?r[1]:'lock'}" style="width:16px"></i><small style="color:inherit">${i}</small></button>`}
return`<div class="card" style="margin-bottom:20px"><div class="hd"><h2 class="s">${MN[mo]} rewards</h2><small>${u} of ${n} unlocked</small></div><p class="m" style="margin-bottom:12px">A new reward every day of the month. Finish 60%+ of the day’s habits to unlock it.</p><div class="cal">${c}</div></div>`};

return`<div class="ov"><div class="md"><div class="hd"><h2 class="s">${S.modal.id?'Edit habit':'New habit'}</h2><button class="ib" onclick="S.modal=null;render()" aria-label="Close"><i data-lucide="x"></i></button></div>
<label class="f"><span>Name</span><input value="${esc(DR.name)}" oninput="DR.name=this.value" placeholder="e.g. Evening walk"></label><label class="f"><span>Description</span><textarea rows="2" oninput="DR.desc=this.value">${esc(DR.desc)}</textarea></label>
<label class="f"><span>Category</span><select onchange="dr('cat',this.value)">${CATS.map(c=>`<option ${c==DR.cat?'selected':''}>${c}</option>`).join('')}</select></label>
<div class="f"><span>Icon</span><div class="pick">${ICO.map(i=>`<button class="pk ${DR.icon==i?'on':''}" onclick="dr('icon','${i}')"><i data-lucide="${i}"></i></button>`).join('')}</div></div>
<div class="f"><span>Colour</span><div class="pick">${COL.map(c=>`<button class="cl ${DR.color==c?'on':''}" style="background:${c}" onclick="dr('color','${c}')" aria-label="${c}"></button>`).join('')}</div></div>
<div class="f"><span>Frequency</span><div class="pick">${sets.map(s=>`<button class="chip ${same(DR.freq,s[1])?'on':''}" onclick="dr('freq',[${s[1]}])">${s[0]}</button>`).join('')}</div><div class="pick">${DN.map((d,i)=>`<button class="pk ${DR.freq.includes(i)?'on':''}" style="width:34px;height:34px" onclick="dd(${i})">${d}</button>`).join('')}</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="f"><span>Reminder time</span><input type="time" value="${DR.time}" onchange="DR.time=this.value"></label><label class="f"><span>Target</span><input value="${esc(DR.target)}" oninput="DR.target=this.value"></label></div>
${S.err?`<p class="err" style="margin-bottom:10px">${S.err}</p>`:''}<button class="btn" style="width:100%" onclick="sv()">Save habit</button></div></div>`}
addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(V[r]&&r!=S.r){S.r=r;render()}});
if(!V[S.r])S.r='today';render();
